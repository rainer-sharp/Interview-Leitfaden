services:
  app:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./data:/app/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      # Ziel des Vite-Proxys; aus dem Frontend-Container ist das Backend unter "app" erreichbar
      VITE_API_URL: http://app:8000
